<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香粧品化学問題集（総合国試対策）</title>
<!-- Excelファイルを読み解くためのライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --primary: #4a90e2;
    --primary-hover: #357abd;
    --success: #2ecc71;
    --error: #e74c3c;
    --bg: #f4f7f6;
    --text: #333;
    --border: #cbd5e1;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 10px;
    margin: 0;
    line-height: 1.5;
  }
  .container {
    max-width: 650px;
    margin: 0 auto;
  }

  /* 操作バー */
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .action-left {
    font-size: 0.85rem;
    font-weight: bold;
    color: #475569;
  }
  .action-right {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-action-sm {
    padding: 5px 10px;
    font-size: 0.78rem;
    font-weight: bold;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: #ffffff;
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s;
  }
  .btn-action-sm:hover { background: #f8fafc; }
  .btn-unit-select { border-color: #0284c7; color: #0369a1; background: #f0f9ff; }
  .btn-pause { border-color: #f59e0b; color: #b45309; }
  .btn-resume { border-color: #10b981; color: #047857; background: #ecfdf5; display: none; }
  .btn-quit { border-color: #ef4444; color: #b91c1c; }
  .btn-home { border-color: #3b82f6; color: #1d4ed8; }

  .card {
    background: #ffffff;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 15px;
  }
  .unit-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: bold;
    color: #1e40af;
    background: #dbeafe;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 10px 0; color: #1e293b; }
  .q-text { font-size: 0.98rem; font-weight: bold; margin-bottom: 14px; white-space: pre-wrap; line-height: 1.5; }

  /* 単元選択画面スタイル */
  .unit-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .unit-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #ffffff;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    color: #1e293b;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .unit-btn:hover {
    border-color: var(--primary);
    background: #f0f7ff;
    transform: translateY(-1px);
  }
  .unit-btn.all-unit {
    background: #eff6ff;
    border-color: #93c5fd;
    color: #1e40af;
  }
  .unit-count {
    font-size: 0.8rem;
    font-weight: normal;
    color: #64748b;
    background: #f1f5f9;
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* 選択肢ボタン */
  .btn-choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
    font-size: 0.92rem;
    cursor: pointer;
    box-sizing: border-box;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .btn-choice:hover:not(:disabled) { border-color: var(--primary); background: #f0f7ff; }
  .btn-choice.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
  .btn-choice.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #b91c1c !important; }

  .feedback-box {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 0.9rem;
    font-weight: bold;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .feedback-correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
  .feedback-wrong { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

  .btn-next {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    display: none;
  }

  .btn-menu-back {
    display: block;
    width: 100%;
    padding: 12px;
    background: #475569;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 8px;
    box-sizing: border-box;
  }
  .btn-menu-unit {
    display: block;
    width: 100%;
    padding: 12px;
    background: #0284c7;
    color: white;
    text-align: center;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 10px;
    box-sizing: border-box;
    cursor: pointer;
    border: none;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 上部操作バー -->
  <div class="action-bar">
    <div class="action-left" id="progress-info">問題 読み込み中...</div>
    <div class="action-right">
      <button class="btn-action-sm btn-unit-select" onclick="showUnitSelectionScreen()">📚 単元選択</button>
      <button class="btn-action-sm btn-pause" id="btn-pause-action" onclick="pauseOldQuiz()">⏸️ 中断</button>
      <button class="btn-action-sm btn-resume" id="btn-old-resume" onclick="resumeOldQuiz()">▶️ 再開</button>
      <button class="btn-action-sm btn-quit" id="btn-quit-action" onclick="quitOldQuiz()">⏹️ 終了</button>
      <a href="index.html" class="btn-action-sm btn-home">🏠 ポータル</a>
    </div>
  </div>

  <!-- メインカード（単元選択または問題表示） -->
  <div class="card" id="quiz-card">
    <div id="unit-badge-area"></div>
    <h2 id="q-title">香粧品化学 総合演習</h2>
    <div class="q-text" id="q-text">問題データを準備しています...</div>
    <div id="choices-area"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <button class="btn-next" id="btn-next" onclick="nextOldQuestion()">次の問題へ ▶</button>
  </div>
</div>

<script>
// 全問題データと単元別管理
let allMasterData = [];
let currentQuizList = [];
let currentUnitName = "ALL";
let currentIndex = 0;
let score = 0;

// MD.xlsx の自動読み込み
window.addEventListener("DOMContentLoaded", function() {
  fetch("MD.xlsx")
    .then(res => {
      if (!res.ok) throw new Error("MD.xlsxの取得に失敗しました");
      return res.arrayBuffer();
    })
    .then(buffer => {
      const workbook = XLSX.read(buffer, { type: "array" });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      
      allMasterData = [];
      // 1行目は見出し行のためスキップ（i = 1 から開始）
      for (let i = 1; i < json.length; i++) {
        const row = json[i];
        if (!row || !row[2]) continue; // 問題文が空ならスキップ

        const no = row[0] || i;
        const unitName = row[1] ? String(row[1]).trim() : "一般香粧品";
        const qText = String(row[2]).trim();

        // 選択肢1〜3の取り出し
        const choices = [];
        if (row[3] !== undefined && row[3] !== null && String(row[3]).trim() !== "") choices.push(String(row[3]).trim());
        if (row[4] !== undefined && row[4] !== null && String(row[4]).trim() !== "") choices.push(String(row[4]).trim());
        if (row[5] !== undefined && row[5] !== null && String(row[5]).trim() !== "") choices.push(String(row[5]).trim());

        // 正答番号（1始まりを0始まりのインデックスに調整）
        const ansIndex = parseInt(row[6], 10) - 1;

        // 各選択肢の解説（列H:7, 列I:8, 列J:9）
        const explanations = [
          row[7] ? String(row[7]).trim() : "",
          row[8] ? String(row[8]).trim() : "",
          row[9] ? String(row[9]).trim() : ""
        ];

        allMasterData.push({
          id: no,
          unit: unitName,
          title: `第${no}問 【${unitName}】`,
          question: qText,
          choices: choices,
          answer: ansIndex,
          explanations: explanations
        });
      }

      if (allMasterData.length === 0) {
        document.getElementById("q-text").innerText = "MD.xlsx に有効な問題データが見つかりませんでした。";
        return;
      }

      // 読み込み完了後、単元選択画面を表示する
      showUnitSelectionScreen();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("q-text").innerText = "問題データ（MD.xlsx）の読み込みに失敗しました。ファイルが同じ場所に配置されているかご確認ください。";
    });
});

// 単元選択画面の描画
function showUnitSelectionScreen() {
  document.getElementById("progress-info").innerText = `学習単元を選択してください（全 ${allMasterData.length} 問）`;
  document.getElementById("btn-pause-action").style.display = "none";
  document.getElementById("btn-old-resume").style.display = "none";
  document.getElementById("btn-quit-action").style.display = "none";

  // 単元ごとの問題数を集計
  const unitMap = {};
  allMasterData.forEach(item => {
    unitMap[item.unit] = (unitMap[item.unit] || 0) + 1;
  });

  let buttonsHtml = `
    <button class="unit-btn all-unit" onclick="startSelectedUnit('ALL')">
      <span>🌟 全単元まとめて演習（全問題）</span>
      <span class="unit-count">${allMasterData.length}問</span>
    </button>
  `;

  for (const [unitName, count] of Object.entries(unitMap)) {
    buttonsHtml += `
      <button class="unit-btn" onclick="startSelectedUnit('${unitName}')">
        <span>📖 ${unitName}</span>
        <span class="unit-count">${count}問</span>
      </button>
    `;
  }

  document.getElementById("quiz-card").innerHTML = `
    <h2 style="color:#1e3a8a; border-bottom:2px solid #e2e8f0; padding-bottom:8px;">🎯 学習する単元を選択してください</h2>
    <div style="font-size:0.88rem; color:#64748b; margin-bottom:12px;">学習したい分野をタップすると演習が始まります。</div>
    <div class="unit-list">${buttonsHtml}</div>
    <a href="index.html" class="btn-menu-back" style="margin-top:16px;">🏠 ポータルトップへ戻る</a>
  `;
}

// 選択した単元の演習開始
function startSelectedUnit(unitName) {
  currentUnitName = unitName;
  if (unitName === "ALL") {
    currentQuizList = [...allMasterData];
  } else {
    currentQuizList = allMasterData.filter(item => item.unit === unitName);
  }

  currentIndex = 0;
  score = 0;

  // カードの基本骨格を元に戻す
  document.getElementById("quiz-card").innerHTML = `
    <div id="unit-badge-area"></div>
    <h2 id="q-title"></h2>
    <div class="q-text" id="q-text"></div>
    <div id="choices-area"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <button class="btn-next" id="btn-next" onclick="nextOldQuestion()">次の問題へ ▶</button>
  `;

  document.getElementById("btn-pause-action").style.display = "inline-block";
  document.getElementById("btn-quit-action").style.display = "inline-block";

  renderOldQuestion();
}

function renderOldQuestion() {
  if (currentIndex >= currentQuizList.length) {
    showOldResult();
    return;
  }

  const item = currentQuizList[currentIndex];
  const unitLabel = currentUnitName === "ALL" ? "全単元演習" : currentUnitName;
  document.getElementById("progress-info").innerText = `【${unitLabel}】問 ${currentIndex + 1} / ${currentQuizList.length} （正解: ${score}点）`;
  document.getElementById("unit-badge-area").innerHTML = `<span class="unit-badge">${item.unit}</span>`;
  document.getElementById("q-title").innerText = item.title;
  document.getElementById("q-text").innerText = item.question;

  const area = document.getElementById("choices-area");
  area.innerHTML = "";
  item.choices.forEach((c, idx) => {
    const btn = document.createElement("button");
    btn.className = "btn-choice";
    btn.innerText = `${idx + 1}. ${c}`;
    btn.onclick = () => selectOldAnswer(idx);
    area.appendChild(btn);
  });

  document.getElementById("feedback-box").style.display = "none";
  document.getElementById("btn-next").style.display = "none";
}

function selectOldAnswer(selectedIdx) {
  const item = currentQuizList[currentIndex];
  const buttons = document.querySelectorAll(".btn-choice");
  buttons.forEach(b => b.disabled = true);

  const fb = document.getElementById("feedback-box");
  const isCorrect = (selectedIdx === item.answer);
  const selectedExp = item.explanations[selectedIdx] || "";

  if (isCorrect) {
    buttons[selectedIdx].classList.add("correct");
    fb.className = "feedback-box feedback-correct";
    fb.innerText = `⭕ 正解です！\n${selectedExp}`;
    score++;
  } else {
    buttons[selectedIdx].classList.add("wrong");
    if (buttons[item.answer]) buttons[item.answer].classList.add("correct");
    fb.className = "feedback-box feedback-wrong";
    const correctExp = item.explanations[item.answer] || "";
    fb.innerText = `❌ 不正解です。（正解：${item.answer + 1}. ${item.choices[item.answer]}）\n${selectedExp ? selectedExp + '\n' : ''}${correctExp}`;
  }

  fb.style.display = "block";
  document.getElementById("btn-next").style.display = "block";
}

function nextOldQuestion() {
  currentIndex++;
  renderOldQuestion();
}

function pauseOldQuiz() {
  alert("⏸️ 演習を一時停止しました。\n「再開」ボタンで続きから解くことができます。");
  document.getElementById("btn-old-resume").style.display = "inline-block";
}

function resumeOldQuiz() {
  document.getElementById("btn-old-resume").style.display = "none";
  alert("▶️ 再開します。");
}

function quitOldQuiz() {
  if (confirm("現在の演習を終了して結果を表示しますか？")) {
    showOldResult();
  }
}

function showOldResult() {
  const total = currentQuizList.length || 1;
  const rate = Math.round((score / total) * 100);
  const unitLabel = currentUnitName === "ALL" ? "全単元演習" : currentUnitName;

  document.getElementById("progress-info").innerText = `演習終了：${unitLabel}`;
  document.getElementById("btn-pause-action").style.display = "none";
  document.getElementById("btn-old-resume").style.display = "none";
  document.getElementById("btn-quit-action").style.display = "none";

  document.getElementById("quiz-card").innerHTML = `
    <h2 style="text-align:center; color:#1e40af;">🏁 【${unitLabel}】が終了しました</h2>
    <div style="text-align:center; margin:16px 0;">
      <div style="font-size:1.2rem; font-weight:bold; background:#eff6ff; color:#1e3a8a; padding:12px; border-radius:10px; border:1px solid #bfdbfe;">
        正解率: ${rate}% （獲得 ${score}点 / 満点 ${total}点）
      </div>
    </div>
    <button class="btn-next" style="display:block; background:#1e3a8a;" onclick="startSelectedUnit('${currentUnitName}')">🔄 この単元をもう一度解く</button>
    <button class="btn-menu-unit" onclick="showUnitSelectionScreen()">📚 別の単元を選択する</button>
    <a href="index.html" class="btn-menu-back">🏠 ポータルトップへ戻る</a>
  `;
}
</script>

</body>
</html>
