<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香粧品化学問題集（総合国試対策）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --primary: #4a90e2;
    --primary-hover: #357abd;
    --success: #2ecc71;
    --error: #e74c3c;
    --bg: #f4f7f6;
    --text: #333;
    --border: #cbd5e1;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 10px;
    margin: 0;
    line-height: 1.5;
  }
  .container {
    max-width: 650px;
    margin: 0 auto;
  }

  /* 操作バー */
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .action-left {
    font-size: 0.85rem;
    font-weight: bold;
    color: #475569;
  }
  .action-right {
    display: flex;
    gap: 6px;
  }
  .btn-action-sm {
    padding: 5px 10px;
    font-size: 0.78rem;
    font-weight: bold;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: #ffffff;
    color: var(--text);
    text-decoration: none;
  }
  .btn-pause { border-color: #f59e0b; color: #b45309; }
  .btn-resume { border-color: #10b981; color: #047857; background: #ecfdf5; display: none; }
  .btn-quit { border-color: #ef4444; color: #b91c1c; }
  .btn-home { border-color: #3b82f6; color: #1d4ed8; }

  .card {
    background: #ffffff;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    margin-bottom: 15px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 10px 0; color: #1e293b; }
  .q-text { font-size: 0.98rem; font-weight: bold; margin-bottom: 14px; white-space: pre-wrap; line-height: 1.5; }

  .btn-choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
    font-size: 0.92rem;
    cursor: pointer;
    box-sizing: border-box;
    transition: all 0.15s;
  }
  .btn-choice:hover:not(:disabled) { border-color: var(--primary); background: #f0f7ff; }
  .btn-choice.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #15803d !important; font-weight: bold; }
  .btn-choice.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #b91c1c !important; }

  .feedback-box {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .feedback-correct { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
  .feedback-wrong { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

  .btn-next {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    display: none;
  }

  .btn-menu-back {
    display: block;
    width: 100%;
    padding: 12px;
    background: #475569;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 10px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 上部操作バー -->
  <div class="action-bar">
    <div class="action-left" id="progress-info">問題 読み込み中...</div>
    <div class="action-right">
      <button class="btn-action-sm btn-pause" onclick="pauseOldQuiz()">⏸️ 中断</button>
      <button class="btn-action-sm btn-resume" id="btn-old-resume" onclick="resumeOldQuiz()">▶️ 再開</button>
      <button class="btn-action-sm btn-quit" onclick="quitOldQuiz()">⏹️ 終了</button>
      <a href="index.html" class="btn-action-sm btn-home">🏠 ポータル</a>
    </div>
  </div>

  <div class="card" id="quiz-card">
    <h2 id="q-title">香粧品化学 総合演習</h2>
    <div class="q-text" id="q-text">問題を準備しています...</div>
    <div id="choices-area"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <button class="btn-next" id="btn-next" onclick="nextOldQuestion()">次の問題へ ▶</button>
  </div>
</div>

<script>
// 状態管理（LocalStorage）
const STORAGE_KEY = "old_kokushi_save_data";
let quizData = [];
let currentIndex = 0;
let score = 0;

// MD.xlsx の自動読み込み
window.addEventListener("DOMContentLoaded", function() {
  fetch("MD.xlsx")
    .then(res => res.arrayBuffer())
    .then(buffer => {
      const workbook = XLSX.read(buffer, { type: "array" });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      
      // データ整形（1行目は見出し）
      quizData = [];
      for (let i = 1; i < json.length; i++) {
        const row = json[i];
        if (row && row[1]) {
          const rawText = String(row[1]).trim();
          const lines = rawText.split("\n").map(l => l.trim()).filter(l => l);
          const ansIndex = parseInt(row[0]) - 1; // 0-indexed

          // 問題文と選択肢の分離
          let qBody = lines[0];
          let choices = [];
          if (lines.length >= 5) {
            qBody = lines.slice(0, lines.length - 4).join("\n");
            choices = lines.slice(lines.length - 4);
          } else {
            choices = lines.slice(1);
          }

          quizData.push({
            id: i,
            title: `第${i}問 国家試験過去問`,
            question: qBody,
            choices: choices,
            answer: ansIndex
          });
        }
      }

      // 進捗復元
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          currentIndex = parsed.currentIndex || 0;
          score = parsed.score || 0;
        } catch(e) {}
      }

      renderOldQuestion();
    })
    .catch(err => {
      document.getElementById("q-text").innerText = "問題データ（MD.xlsx）の読み込みに失敗しました。ファイルが同じフォルダにあるか確認してください。";
    });
});

function renderOldQuestion() {
  if (currentIndex >= quizData.length) {
    showOldResult();
    return;
  }

  const item = quizData[currentIndex];
  document.getElementById("progress-info").innerText = `問 ${currentIndex + 1} / ${quizData.length} （正解: ${score}点）`;
  document.getElementById("q-title").innerText = item.title;
  document.getElementById("q-text").innerText = item.question;

  const area = document.getElementById("choices-area");
  area.innerHTML = "";
  item.choices.forEach((c, idx) => {
    const btn = document.createElement("button");
    btn.className = "btn-choice";
    btn.innerText = c;
    btn.onclick = () => selectOldAnswer(idx);
    area.appendChild(btn);
  });

  document.getElementById("feedback-box").style.display = "none";
  document.getElementById("btn-next").style.display = "none";
}

function selectOldAnswer(selectedIdx) {
  const item = quizData[currentIndex];
  const buttons = document.querySelectorAll(".btn-choice");
  buttons.forEach(b => b.disabled = true);

  const fb = document.getElementById("feedback-box");
  const isCorrect = (selectedIdx === item.answer);

  if (isCorrect) {
    buttons[selectedIdx].classList.add("correct");
    fb.className = "feedback-box feedback-correct";
    fb.innerText = "⭕ 正解です！";
    score++;
  } else {
    buttons[selectedIdx].classList.add("wrong");
    if (buttons[item.answer]) buttons[item.answer].classList.add("correct");
    fb.className = "feedback-box feedback-wrong";
    fb.innerText = `❌ 不正解です。（正解：選択肢 ${item.answer + 1}）`;
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentIndex: currentIndex + 1, score: score }));
  fb.style.display = "block";
  document.getElementById("btn-next").style.display = "block";
}

function nextOldQuestion() {
  currentIndex++;
  renderOldQuestion();
}

function pauseOldQuiz() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentIndex: currentIndex, score: score }));
  alert("⏸️ 学習を一時保存しました。\n次回もこの問題から再開できます。");
  document.getElementById("btn-old-resume").style.display = "inline-block";
}

function resumeOldQuiz() {
  document.getElementById("btn-old-resume").style.display = "none";
  alert("▶️ 再開します。");
}

function quitOldQuiz() {
  if (confirm("学習を終了して結果を表示しますか？")) {
    showOldResult();
  }
}

function showOldResult() {
  const total = quizData.length || 1;
  const rate = Math.round((score / total) * 100);
  document.getElementById("quiz-card").innerHTML = `
    <h2 style="text-align:center; color:#1e40af;">🏁 演習が終了しました</h2>
    <div style="text-align:center; margin:16px 0;">
      <div style="font-size:1.2rem; font-weight:bold; background:#eff6ff; color:#1e3a8a; padding:12px; border-radius:10px; border:1px solid #bfdbfe;">
        正解率: ${rate}% （獲得 ${score}点 / 満点 ${total}点）
      </div>
    </div>
    <button class="btn-next" style="display:block; background:#1e3a8a;" onclick="restartOldQuiz()">🔄 もう一度最初から解く</button>
    <a href="index.html" class="btn-menu-back">🏠 ポータルトップへ戻る</a>
  `;
}

function restartOldQuiz() {
  localStorage.removeItem(STORAGE_KEY);
  currentIndex = 0;
  score = 0;
  location.reload();
}
</script>

</body>
</html>
