<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香粧品化学問題集</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2; /* メインカラー（青） */
            --primary-hover: #357abd; /* ホバー時の濃い青 */
            --success: #2ecc71; /* 正解（緑） */
            --error: #e74c3c;   /* 不正解（赤） */
            --bg: #f4f7f6;
            --text: #333;
        }
        body {
            font-family: \"Helvetica Neue\", Arial, \"Hiragino Kaku Gothic ProN\", \"Hiragino Sans\", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }
        #app {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            margin: 10px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: left;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .center-btn {
            text-align: center;
        }
        /* ファイル入力エリアのデザイン */
        .file-input-container {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #fafafa;
            margin: 20px 0;
            position: relative;
        }
        .file-input-container p {
            margin: 0 0 15px 0;
            color: #666;
            font-size: 14px;
        }
        .custom-file-btn {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .custom-file-btn:hover {
            background-color: #d35400;
        }
        #excel-file {
            display: none;
        }
        /* 状態表示メッセージ */
        #status-msg {
            text-align: center;
            font-weight: bold;
            color: #e67e22;
            margin: 15px 0;
            min-height: 24px;
        }
        /* 問題表示用のスタイル */
        .q-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .q-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }
        .option-btn:hover {
            background-color: #e9ecef;
        }
        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }
        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }
        /* 解説エリア */
        #feedback {
            margin: 20px 0;
            padding: 15px;
            border-left: 5px solid #ccc;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        .hidden {
            display: none !important;
        }
        /* 結果画面 */
        .result-box {
            text-align: center;
            padding: 20px;
            background: #eef2f7;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .score-num {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-load" class="screen active">
        <h1>香粧品化学問題集</h1>
        <div id="status-msg">問題ファイルを自動読み込み中...</div>
        
        <div class="file-input-container">
            <p>※自動読み込みが出ない場合は、下のボタンからエクセルファイル（MD.xlsx）を選んでください。</p>
            <label for="excel-file" class="custom-file-btn">エクセルファイルを選択</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <h2>単元を選択してください</h2>
        <div id="category-list"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span id="current-category">単元名</span>
            <span id="q-progress">0 / 0 問</span>
        </div>
        <div id="q-text" class="q-text">問題文がここに表示されます。</div>
        <div id="options-list"></div>
        <div id="feedback"></div>
        <button id="next-btn" class="btn center-btn hidden" onclick="handleNext()">次の問題へ</button>
    </div>

    <div id="screen-result" class="screen">
        <h2>結果発表</h2>
        <div class="result-box">
            <div>あなたの正解数は</div>
            <div id="score-text" class="score-num">0 / 0</div>
            <div>でした！</div>
        </div>
        <button class="btn center-btn" onclick="restart()">最初に戻る</button>
    </div>
</div>

<script>
// アプリ全体のデータを管理する状態（ステート）
const state = {
    allQuestions: [],     // エクセルから読み込んだ全問題
    categories: [],       // 単元のリスト
    currentQuestions: [], // 現在選択されている単元の問題リスト
    currentIndex: 0,      // 現在何問目か
    score: 0              // 正解数
};

// 画面が読み込まれたら自動的にMD.xlsxを探しにいく
window.onload = function() {
    autoLoadExcel();
    // 手動でファイルが選ばれた時の動きも残しておく
    document.getElementById('excel-file').addEventListener('change', handleFileSelect, false);
};

// 自動読み込みを行う命令
async function autoLoadExcel() {
    const statusMsg = document.getElementById("status-msg");
    try {
        // 同じ場所にある「MD.xlsx」を自動で取得する
        const response = await fetch('MD.xlsx');
        if (!response.ok) {
            throw new Error("ファイルが見つかりません");
        }
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        
        // 読み込み成功、中身を解析する
        processWorkbook(workbook);
        statusMsg.innerText = "自動読み込みが完了しました！";
        setTimeout(() => { showScreen("screen-menu"); }, 800);
        
    } catch (error) {
        console.log("自動読み込みスキップ:", error.message);
        statusMsg.innerText = "エクセルファイル（MD.xlsx）を選択してください。";
    }
}

// 手動でファイルを選んだ場合の処理
function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    document.getElementById("status-msg").innerText = "ファイルを読み込み中...";
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        processWorkbook(workbook);
        showScreen("screen-menu");
    };
    reader.readAsArrayBuffer(file);
}

// エクセルのデータを中身の配列に変換する共通処理
function processWorkbook(workbook) {
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    // 一行目を項目名（ヘッダー）としてJSON（ジェイソン）形式にする
    const rawData = XLSX.utils.sheet_to_json(worksheet);
    
    // プログラムで扱いやすい形に整理（整形）する
    state.allQuestions = rawData.map(row => {
        return {
            category: row['単元名'] || '未分類',
            text: row['問題文'] || '',
            options: [
                row['選択肢1'] || '',
                row['選択肢2'] || '',
                row['選択肢3'] || '',
                row['選択肢4'] || ''
            ].filter(opt => opt !== ''), // 空の選択肢は除外
            ans: parseInt(row['正解番号']) - 1, // 1〜4の番号を0〜3の計算用に直す
            note: row['解説'] || '解説はありません。'
        };
    });
    
    // 重複のない単元名のリストを作る
    const catSet = new Set(state.allQuestions.map(q => q.category));
    state.categories = Array.from(catSet);
    
    // 単元選択画面にボタンを並べる
    makeMenu();
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function makeMenu() {
    const listDiv = document.getElementById("category-list");
    listDiv.innerHTML = "";
    
    state.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = cat;
        btn.onclick = () => startQuiz(cat);
        listDiv.appendChild(btn);
    });
}

function startQuiz(category) {
    // 選択された単元の問題だけを集める
    state.currentQuestions = state.allQuestions.filter(q => q.category === category);
    // 問題をランダムに並び替える（シャッフル）
    state.currentQuestions.sort(() => Math.random() - 0.5);
    
    state.currentIndex = 0;
    state.score = 0;
    document.getElementById("current-category").innerText = category;
    
    showScreen("screen-quiz");
    showQuestion();
}

function showQuestion() {
    // 画面の表示をきれいにリセットする
    document.getElementById("next-btn").classList.add("hidden");
    const feedback = document.getElementById("feedback");
    feedback.style.display = "none";
    feedback.innerHTML = "";
    
    const q = state.currentQuestions[state.currentIndex];
    document.getElementById("q-progress").innerText = `${state.currentIndex + 1} / ${state.currentQuestions.length} 問`;
    document.getElementById("q-text").innerText = q.text;
    
    const optionsDiv = document.getElementById("options-list");
    optionsDiv.innerHTML = "";
    
    // 選択肢のボタンを作って画面に並べる
    q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn option-btn";
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => handleAnswer(idx);
        optionsDiv.appendChild(btn);
    });
}

function handleAnswer(idx) {
    const q = state.currentQuestions[state.currentIndex];
    const optionsDiv = document.getElementById("options-list");
    const btns = optionsDiv.children;
    
    // 一度答えたら他のボタンを押せなくする
    for (let i = 0; i < btns.length; i++) {
        btns[i].disabled = true;
    }
    
    const feedback = document.getElementById("feedback");
    
    if (idx === q.ans) {
        btns[idx].classList.add("correct");
        feedback.style.backgroundColor = "#d1e7dd";
        feedback.style.color = "#0f5132";
        feedback.style.borderLeftColor = "#198754";
        feedback.innerHTML = `<strong>【正解！】</strong><br>${q.note}`;
        state.score++;
    } else {
        btns[idx].classList.add("incorrect");
        if (q.ans >= 0 && q.ans < btns.length) {
            btns[q.ans].classList.add("correct");
        }
        feedback.style.backgroundColor = "#f8d7da";
        feedback.style.color = "#842029";
        feedback.style.borderLeftColor = "#dc3545";
        feedback.innerHTML = `<strong>【不正解...】</strong><br>${q.note}`;
    }
    
    feedback.style.display = "block";
    document.getElementById("next-btn").classList.remove("hidden");
}

function handleNext() {
    state.currentIndex++;
    if (state.currentIndex < state.currentQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    showScreen("screen-result");
    const total = state.currentQuestions.length;
    document.getElementById("score-text").innerText = `${state.score} / ${total}`;
}

function restart() {
    showScreen("screen-menu");
}
</script>

</body>
</html>
