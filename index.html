<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香粧品化学問題集</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2; /* 主な色（青） */
            --primary-hover: #357abd; /* マウスを載せたときの濃い青 */
            --success: #2ecc71; /* 正解時の色（緑） */
            --error: #e74c3c;   /* 不正解時の色（赤） */
            --bg: #f4f7f6;      /* 背景の色 */
            --text: #333;       /* 文字の色 */
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }
        #app {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            margin: 10px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .screen {
            display: none; /* 通常は画面を非表示にする設定 */
        }
        .screen.active {
            display: block; /* 活発な（選択されている）画面だけを表示する設定 */
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: left;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .center-btn {
            text-align: center;
        }
        /* ファイルを入れる場所の装飾 */
        .file-input-container {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #fafafa;
            margin: 20px 0;
            position: relative;
        }
        .file-input-container p {
            margin: 0 0 15px 0;
            color: #666;
            font-size: 14px;
        }
        .custom-file-btn {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .custom-file-btn:hover {
            background-color: #d35400;
        }
        #excel-file {
            display: none;
        }
        /* 状態を表示する伝言板 */
        #status-msg {
            text-align: center;
            font-weight: bold;
            color: #e67e22;
            margin: 15px 0;
            min-height: 24px;
        }
        /* 問題を表示する画面の装飾 */
        .q-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .q-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }
        .option-btn:hover {
            background-color: #e9ecef;
        }
        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }
        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }
        /* 解説を載せる枠 */
        #feedback {
            margin: 20px 0;
            padding: 15px;
            border-left: 5px solid #ccc;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        .hidden {
            display: none !important; /* 画面から隠す設定 */
        }
        /* 得点結果を表示する枠 */
        .result-box {
            text-align: center;
            padding: 20px;
            background: #eef2f7;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .score-num {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
        /* 再挑戦用の特製ボタン */
        .retry-btn {
            background-color: #2ecc71;
        }
        .retry-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-load" class="screen active">
        <h1>香粧品化学問題集</h1>
        <div id="status-msg">問題ファイルを自動読み込み中...</div>
        
        <div class="file-input-container">
            <p>※自動読み込みが出ない場合は、下のボタンからエクセルファイル（MD.xlsx）を選んでください。</p>
            <label for="excel-file" class="custom-file-btn">エクセルファイルを選択</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <h2>単元を選択してください</h2>
        <div id="category-list"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span id="current-category">単元名</span>
            <span id="q-progress">0 / 0 問</span>
        </div>
        <div id="q-text" class="q-text">問題文がここに表示されます。</div>
        <div id="options-list"></div>
        <div id="feedback"></div>
        <button id="next-btn" class="btn center-btn hidden" onclick="handleNext()">次の問題へ</button>
    </div>

    <div id="screen-result" class="screen">
        <h2>結果発表</h2>
        <div class="result-box">
            <div>あなたの正解数は</div>
            <div id="score-text" class="score-num">0 / 0</div>
            <div>でした！</div>
        </div>
        <button class="btn center-btn retry-btn" onclick="retryCurrentCategory()">もう一度この単元を解く（ランダム順）</button>
        <button class="btn center-btn" onclick="goToMenu()">単元選択に戻る</button>
    </div>
</div>

<script>
// 全体のデータを記憶しておく場所（状態管理）
const state = {
    allQuestions: [],        // すべての問題
    categories: [],          // 単元名の一覧
    currentCategoryName: "", // 今選ばれている単元の名前
    currentQuestions: [],    // 今解いている単元の問題たち
    currentIndex: 0,         // 今何問目を解いているか
    score: 0                 // 合格・正解した数
};

// 画面が完全に表示されたら最初に動く処理
window.onload = function() {
    autoLoadExcel();
    document.getElementById('excel-file').addEventListener('change', handleFileSelect, false);
};

// 自動でエクセル（MD.xlsx）を探して読み込む処理
async function autoLoadExcel() {
    const statusMsg = document.getElementById("status-msg");
    try {
        const response = await fetch('MD.xlsx');
        if (!response.ok) {
            throw new Error("ファイルが見つかりません");
        }
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        
        processWorkbook(workbook);
        statusMsg.innerText = "自動読み込みが完了しました！";
        setTimeout(() => { showScreen("screen-menu"); }, 800);
        
    } catch (error) {
        console.log("自動読み込みスキップ:", error.message);
        statusMsg.innerText = "エクセルファイル（MD.xlsx）を選択してください。";
    }
}

// 手動でファイルを選んだ時の処理
function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    document.getElementById("status-msg").innerText = "ファイルを読み込み中...";
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        processWorkbook(workbook);
        showScreen("screen-menu");
    };
    reader.readAsArrayBuffer(file);
}

// エクセルのデータを読み込み、見出しを探して整理する処理
function processWorkbook(workbook) {
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    // sheet_to_jsonの通常の変換機能を使い、1行目の見出しを基準としたデータ（連想配列）の集まりにする
    const rawData = XLSX.utils.sheet_to_json(worksheet);
    
    state.allQuestions = [];
    const categorySet = new Set();

    if (rawData.length === 0) {
        alert("エクセルファイルの中にデータが見つかりませんでした。");
        return;
    }

    // 1行目の見出しの中から、どの言葉がどの項目に当てはまるかを自動で探す
    const firstRow = rawData[0];
    let keys = Object.keys(firstRow);

    // 見出しの名前を判定するためのキーワードを設定
    const categoryKey = keys.find(k => k.includes("単元") || k.includes("分類") || k.includes("カテゴリ"));
    const textKey = keys.find(k => k.includes("問題") || k.includes("本文") || k.includes("問い"));
    const answerKey = keys.find(k => k.includes("正解") || k.includes("答え") || k.includes("解答"));
    const explanationKey = keys.find(k => k.includes("解説"));

    // 選択肢の列（「選択肢」という文字が入っている、または「選択肢1」などの列）をすべて集める
    const optionKeys = keys.filter(k => k.includes("選択肢") || k.includes("択"));

    // もし上記の見つからない場合は、予備として元の「列の順番」で強制的に割り当てる
    const finalCategoryKey = categoryKey || keys[0];
    const finalTextKey = textKey || keys[1];
    const finalAnswerKey = answerKey || keys[2];
    const finalExplanationKey = explanationKey || keys[keys.length - 1]; // 一番最後の列を解説とみなす

    rawData.forEach(row => {
        // データの取り出しと、前後の余計な空白の削除
        const categoryVal = row[finalCategoryKey] ? row[finalCategoryKey].toString().trim() : "未分類";
        const textVal = row[finalTextKey] ? row[finalTextKey].toString().trim() : "";
        const answerVal = row[finalAnswerKey] ? row[finalAnswerKey].toString().trim() : "";
        const explanationVal = row[finalExplanationKey] ? row[finalExplanationKey].toString().trim() : "解説はありません。";

        // 選択肢を1つのまとまりにする
        let opts = [];
        if (optionKeys.length > 0) {
            // 「選択肢」という見出し列が見つかった場合はそこから集める
            optionKeys.forEach(k => {
                if (row[k] !== undefined && row[k] !== null && row[k] !== "") {
                    opts.push(row[k].toString().trim());
                }
            });
        } else {
            // 見出しで判定できない場合は、正解の答えの列から4つ分を引っ張る
            const ansIndex = keys.indexOf(finalAnswerKey);
            for (let m = 0; m < 4; m++) {
                const targetKey = keys[ansIndex + m];
                if (targetKey && row[targetKey] !== undefined && row[targetKey] !== null && row[targetKey] !== "") {
                    opts.push(row[targetKey].toString().trim());
                }
            }
        }

        // 最低限、問題文が存在する場合のみ問題リストに追加する
        if (textVal) {
            state.allQuestions.push({
                category: categoryVal,
                text: textVal,
                answer: answerVal,
                options: opts,
                explanation: explanationVal
            });
            categorySet.add(categoryVal);
        }
    });
    
    state.categories = Array.from(categorySet);
    createMenu();
}

// 単元を選ぶためのボタン一覧を画面に作る処理
function createMenu() {
    const container = document.getElementById("category-list");
    container.innerHTML = "";
    
    state.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = cat;
        btn.onclick = () => startQuiz(cat, false); // 最初は問題順を混ぜずに開始
        container.appendChild(btn);
    });
}

// クイズを開始する準備処理
function startQuiz(categoryName, shouldShuffle = false) {
    state.currentCategoryName = categoryName;
    
    // 選んだ単元の問題だけを集める
    let questions = state.allQuestions.filter(q => q.category === categoryName);
    
    // 元のデータを傷つけないように、新しく問題の複製（コピー）を作る
    state.currentQuestions = questions.map(q => ({
        ...q,
        options: [...q.options]
    }));
    
    // 「もう一度解く」ボタンから呼ばれた時（shouldShuffleが真の時）は問題の並びを混ぜる
    if (shouldShuffle) {
        shuffleArray(state.currentQuestions);
        // 各問題の中の選択肢の並びも混ぜる
        state.currentQuestions.forEach(q => shuffleArray(q.options));
    } else {
        // 通常の時は、問題順はそのままで、選択肢の並びだけを混ぜる
        state.currentQuestions.forEach(q => shuffleArray(q.options));
    }
    
    state.currentIndex = 0;
    state.score = 0;
    document.getElementById("current-category").innerText = categoryName;
    showQuiz();
    showScreen("screen-quiz");
}

// 実際に1問ずつの内容を画面に書き出す処理
function showQuiz() {
    const q = state.currentQuestions[state.currentIndex];
    
    // 何問中、今何問目かを表示
    document.getElementById("q-progress").innerText = (state.currentIndex + 1) + " / " + state.currentQuestions.length + " 問";
    
    // 問題文を表示
    document.getElementById("q-text").innerText = q.text;
    
    // 前の問題の解説枠や「次へ」ボタンを隠す
    document.getElementById("feedback").style.display = "none";
    document.getElementById("next-btn").classList.add("hidden");
    
    // 選択肢のボタンを新しく作り直して表示
    const optionsContainer = document.getElementById("options-list");
    optionsContainer.innerHTML = "";
    
    q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(btn, opt, q);
        optionsContainer.appendChild(btn);
    });
}

// 選択肢ボタンが押された時の正誤判定処理
function selectOption(selectedBtn, selectedText, question) {
    const buttons = document.querySelectorAll("#options-list .option-btn");
    
    // 何度もボタンを押せないようにすべての選択肢をロック（無効化）する
    buttons.forEach(b => b.disabled = true);
    
    const isCorrect = (selectedText === question.answer);
    if (isCorrect) {
        selectedBtn.classList.add("correct");
        state.score++;
    } else {
        selectedBtn.classList.add("incorrect");
        // 間違えた場合は、どれが正解だったのかを緑色で教えてあげる
        buttons.forEach(b => {
            if (b.innerText === question.answer) {
                b.classList.add("correct");
            }
        });
    }
    
    // 解説枠を表示する
    const feedback = document.getElementById("feedback");
    feedback.style.display = "block";
    feedback.style.borderColor = isCorrect ? "var(--success)" : "var(--error)";
    feedback.innerHTML = "<strong>" + (isCorrect ? "⭕ 正解！" : "❌ 不正解...") + "</strong><br>" + question.explanation;
    
    // 「次の問題へ」進むボタンを画面に出す
    document.getElementById("next-btn").classList.remove("hidden");
}

// 「次の問題へ」ボタンが押された時の行き先決定処理
function handleNext() {
    state.currentIndex++;
    if (state.currentIndex < state.currentQuestions.length) {
        // まだ問題が残っていれば次の問題を表示
        showQuiz();
    } else {
        // すべて解き終わったら結果画面を表示
        document.getElementById("score-text").innerText = state.score + " / " + state.currentQuestions.length;
        showScreen("screen-result");
    }
}

// 同じ単元の問題をランダム（順不規則）にしてもう一度最初から解く処理
function retryCurrentCategory() {
    startQuiz(state.currentCategoryName, true);
}

// 単元を選ぶメニュー画面に戻る処理
function goToMenu() {
    showScreen("screen-menu");
}

// 指定した画面だけを表示して、それ以外を隠す切り替え機能
function showScreen(screenId) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(screenId).classList.add("active");
}

// 中身の並び順を完全に不規則（ランダム）に入れ替える仕組み
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = array[i];
        array[i] = array[j];
        array[j] = temp;
    }
}
</script>

</body>
</html>
