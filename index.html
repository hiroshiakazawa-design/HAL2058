<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香粧品化学問題集</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2; /* 主な色（青） */
            --primary-hover: #357abd; /* マウスを載せたときの濃い青 */
            --success: #2ecc71; /* 正解時の色（緑） */
            --error: #e74c3c;   /* 不正解時の色（赤） */
            --bg: #f4f7f6;      /* 背景の色 */
            --text: #333;       /* 文字の色 */
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }
        #app {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            margin: 10px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .screen {
            display: none; /* 通常は画面を非表示にする設定 */
        }
        .screen.active {
            display: block; /* 活発な（選択されている）画面だけを表示する設定 */
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: left;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .center-btn {
            text-align: center;
        }
        /* ファイルを入れる場所の装飾 */
        .file-input-container {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #fafafa;
            margin: 20px 0;
            position: relative;
        }
        .file-input-container p {
            margin: 0 0 15px 0;
            color: #666;
            font-size: 14px;
        }
        .custom-file-btn {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .custom-file-btn:hover {
            background-color: #d35400;
        }
        #excel-file {
            display: none;
        }
        /* 状態を表示する伝言板 */
        #status-msg {
            text-align: center;
            font-weight: bold;
            color: #e67e22;
            margin: 15px 0;
            min-height: 24px;
        }
        /* 問題を表示する画面の装飾 */
        .q-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .q-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }
        .option-btn:hover {
            background-color: #e9ecef;
        }
        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }
        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }
        /* 解説を載せる枠 */
        #feedback {
            margin: 20px 0;
            padding: 15px;
            border-left: 5px solid #ccc;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        .hidden {
            display: none !important; /* 画面から隠す設定 */
        }
        /* 得点結果を表示する枠 */
        .result-box {
            text-align: center;
            padding: 20px;
            background: #eef2f7;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .score-num {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
        /* 再挑戦用の特製ボタン */
        .retry-btn {
            background-color: #2ecc71;
        }
        .retry-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-load" class="screen active">
        <h1>香粧品化学問題集</h1>
        <div id="status-msg">問題ファイルを自動読み込み中...</div>
        
        <div class="file-input-container">
            <p>※自動読み込みが出ない場合は、下のボタンからエクセルファイル（MD.xlsx）を選んでください。</p>
            <label for="excel-file" class="custom-file-btn">エクセルファイルを選択</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <h2>単元を選択してください</h2>
        <div id="category-list"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span id="current-category">単元名</span>
            <span id="q-progress">0 / 0 問</span>
        </div>
        <div id="q-text" class="q-text">問題文がここに表示されます。</div>
        <div id="options-list"></div>
        <div id="feedback"></div>
        <button id="next-btn" class="btn center-btn hidden" onclick="handleNext()">次の問題へ</button>
    </div>

    <div id="screen-result" class="screen">
        <h2>結果発表</h2>
        <div class="result-box">
            <div>あなたの正解数は</div>
            <div id="score-text" class="score-num">0 / 0</div>
            <div>でした！</div>
        </div>
        <button class="btn center-btn retry-btn" onclick="retryCurrentCategory()">もう一度この単元を解く（ランダム順）</button>
        <button class="btn center-btn" onclick="goToMenu()">単元選択に戻る</button>
    </div>
</div>

<script>
const state = {
    allQuestions: [],        // すべての問題
    categories: [],          // 単元名の一覧
    currentCategoryName: "", // 今選ばれている単元の名前
    currentQuestions: [],    // 今解いている単元の問題たち
    currentIndex: 0,         // 今何問目を解いているか
    score: 0                 // 正解した数
};

window.onload = function() {
    autoLoadExcel();
    document.getElementById('excel-file').addEventListener('change', handleFileSelect, false);
};

async function autoLoadExcel() {
    const statusMsg = document.getElementById("status-msg");
    try {
        const response = await fetch('MD.xlsx');
        if (!response.ok) {
            throw new Error("ファイルが見つかりません");
        }
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        
        processWorkbook(workbook);
        statusMsg.innerText = "自動読み込みが完了しました！";
        setTimeout(() => { showScreen("screen-menu"); }, 800);
        
    } catch (error) {
        console.log("自動読み込みスキップ:", error.message);
        statusMsg.innerText = "エクセルファイル（MD.xlsx）を選択してください。";
    }
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    document.getElementById("status-msg").innerText = "ファイルを読み込み中...";
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        processWorkbook(workbook);
        showScreen("screen-menu");
    };
    reader.readAsArrayBuffer(file);
}

// セルの値からエラーを起こさず確実に文字を取り出す安全関数
function getSafeString(cellValue) {
    if (cellValue === undefined || cellValue === null) {
        return "";
    }
    return cellValue.toString().trim();
}

function processWorkbook(workbook) {
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    
    // 列順（A, B, C...）で2次元配列として直接読み込みます
    const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
    
    state.allQuestions = [];
    const categorySet = new Set();

    if (rawData.length <= 1) {
        alert("エクセルファイルの中に有効な問題データが見つかりませんでした。");
        return;
    }

    // 2行目から処理を開始します
    for (let i = 1; i < rawData.length; i++) {
        const row = rawData[i];
        if (!row || row.length === 0) continue;

        // A=0(No), B=1(単元名), C=2(問題文), D=3(選択肢1), E=4(選択肢2), F=5(選択肢3), G=6(正答番号), H=7(解説1), I=8(解説2), J=9(解説3)
        const categoryVal = getSafeString(row[1]) || "未分類";
        const textVal     = getSafeString(row[2]);
        
        const opt1 = getSafeString(row[3]);
        const opt2 = getSafeString(row[4]);
        const opt3 = getSafeString(row[5]);
        
        let answerIndexRaw = getSafeString(row[6]);
        answerIndexRaw = answerIndexRaw.replace(/[１-３]/g, function(s) {
            return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
        });
        const answerIndex = parseInt(answerIndexRaw, 10);

        // 【最重要】シャッフルされても元の「何番の選択肢か」を追跡できるように、
        // 各選択肢に「元の番号（originalIndex）」を持たせたオブジェクトの配列にします
        const originalOptions = [
            { text: opt1, originalIndex: 1 },
            { text: opt2, originalIndex: 2 },
            { text: opt3, originalIndex: 3 }
        ];
        
        if (!textVal) continue;

        // 正答番号（1〜3）に対応する正解の文字列を決定
        const correctAnswerText = (answerIndex >= 1 && answerIndex <= 3) 
            ? originalOptions[answerIndex - 1].text 
            : "";

        if (correctAnswerText === "") continue;

        // 【解説個別化の修正】
        // 3つを合体させるのではなく、元の番号ごとに個別の解説として記憶させておきます
        const exp1 = getSafeString(row[7]);
        const exp2 = getSafeString(row[8]);
        const exp3 = getSafeString(row[9]);

        state.allQuestions.push({
            category: categoryVal,
            text: textVal,
            answer: correctAnswerText, 
            options: originalOptions,  // オブジェクトの配列
            explanations: {
                1: exp1 || "解説はありません。",
                2: exp2 || "解説はありません。",
                3: exp3 || "解説はありません。"
            }
        });
        categorySet.add(categoryVal);
    }
    
    state.categories = Array.from(categorySet);
    createMenu();
}

function createMenu() {
    const container = document.getElementById("category-list");
    container.innerHTML = "";
    
    state.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = cat;
        btn.onclick = () => startQuiz(cat, false);
        container.appendChild(btn);
    });
}

function startQuiz(categoryName, shouldShuffle = false) {
    state.currentCategoryName = categoryName;
    let questions = state.allQuestions.filter(q => q.category === categoryName);
    
    // 深いコピーを行ってクイズ用の配列を生成
    state.currentQuestions = questions.map(q => ({
        ...q,
        options: q.options.map(o => ({ ...o }))
    }));
    
    if (shouldShuffle) {
        shuffleArray(state.currentQuestions);
    }
    // 選択肢をランダムに並び替えます（元のoriginalIndexの情報は保持されます）
    state.currentQuestions.forEach(q => shuffleArray(q.options));
    
    state.currentIndex = 0;
    state.score = 0;
    document.getElementById("current-category").innerText = categoryName;
    showQuiz();
    showScreen("screen-quiz");
}

function showQuiz() {
    const q = state.currentQuestions[state.currentIndex];
    document.getElementById("q-progress").innerText = (state.currentIndex + 1) + " / " + state.currentQuestions.length + " 問";
    document.getElementById("q-text").innerText = q.text;
    
    document.getElementById("feedback").style.display = "none";
    document.getElementById("next-btn").classList.add("hidden");
    
    const optionsContainer = document.getElementById("options-list");
    optionsContainer.innerHTML = "";
    
    q.options.forEach(optObj => {
        if (optObj.text === "") return;

        const btn = document.createElement("button");
        btn.className = "btn option-btn";
        btn.innerText = optObj.text;
        // ボタンを押した際、その選択肢の「元の番号（originalIndex）」を渡すようにします
        btn.onclick = () => selectOption(btn, optObj.text, optObj.originalIndex, q);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(selectedBtn, selectedText, originalIndex, question) {
    const buttons = document.querySelectorAll("#options-list .option-btn");
    buttons.forEach(b => b.disabled = true);
    
    const isCorrect = (selectedText === question.answer);
    if (isCorrect) {
        selectedBtn.classList.add("correct");
        state.score++;
    } else {
        selectedBtn.classList.add("incorrect");
        buttons.forEach(b => {
            if (b.innerText === question.answer) {
                b.classList.add("correct");
            }
        });
    }
    
    // 【解説出し分けの核心処理】
    // 学生が選んだボタンに対応する「元の選択肢番号」の解説（1、2、または3）だけを抽出します
    const chosenExplanation = question.explanations[originalIndex];
    
    const feedback = document.getElementById("feedback");
    feedback.style.display = "block";
    feedback.style.borderColor = isCorrect ? "var(--success)" : "var(--error)";
    feedback.innerHTML = "<strong>" + (isCorrect ? "⭕ 正解！" : "❌ 不正解...") + "</strong><br>" + chosenExplanation;
    
    document.getElementById("next-btn").classList.remove("hidden");
}

function handleNext() {
    state.currentIndex++;
    if (state.currentIndex < state.currentQuestions.length) {
        showQuiz();
    } else {
        document.getElementById("score-text").innerText = state.score + " / " + state.currentQuestions.length;
        showScreen("screen-result");
    }
}

function retryCurrentCategory() {
    startQuiz(state.currentCategoryName, true);
}

function goToMenu() {
    showScreen("screen-menu");
}

function showScreen(screenId) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(screenId).classList.add("active");
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = array[i];
        array[i] = array[j];
        array[j] = temp;
    }
}
</script>

</body>
</html>
