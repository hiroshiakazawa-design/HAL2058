<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香粧品化学問題集</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2; /* 主な色（青） */
            --primary-hover: #357abd; /* マウスを載せたときの濃い青 */
            --success: #2ecc71; /* 正解時の色（緑） */
            --error: #e74c3c;   /* 不正解時の色（赤） */
            --bg: #f4f7f6;      /* 背景の色 */
            --text: #333;       /* 文字の色 */
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }
        #app {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            margin: 10px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .screen {
            display: none; /* 通常は画面を非表示にする設定 */
        }
        .screen.active {
            display: block; /* 活発な（選択されている）画面だけを表示する設定 */
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: left;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .center-btn {
            text-align: center;
        }
        /* ファイルを入れる場所の装飾 */
        .file-input-container {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #fafafa;
            margin: 20px 0;
            position: relative;
        }
        .file-input-container p {
            margin: 0 0 15px 0;
            color: #666;
            font-size: 14px;
        }
        .custom-file-btn {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .custom-file-btn:hover {
            background-color: #d35400;
        }
        #excel-file {
            display: none;
        }
        /* 状態を表示する伝言板 */
        #status-msg {
            text-align: center;
            font-weight: bold;
            color: #e67e22;
            margin: 15px 0;
            min-height: 24px;
        }
        /* 問題を表示する画面の装飾 */
        .q-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .q-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }
        .option-btn:hover {
            background-color: #e9ecef;
        }
        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }
        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }
        /* 解説を載せる枠 */
        #feedback {
            margin: 20px 0;
            padding: 15px;
            border-left: 5px solid #ccc;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        .hidden {
            display: none !important; /* 画面から隠す設定 */
        }
        /* 得点結果を表示する枠 */
        .result-box {
            text-align: center;
            padding: 20px;
            background: #eef2f7;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .score-num {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
        /* 再挑戦用の特製ボタン */
        .retry-btn {
            background-color: #2ecc71;
        }
        .retry-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-load" class="screen active">
        <h1>香粧品化学問題集</h1>
        <div id="status-msg">問題ファイルを自動読み込み中...</div>
        
        <div class="file-input-container">
            <p>※自動読み込みが出ない場合は、下のボタンからエクセルファイル（MD.xlsx）を選んでください。</p>
            <label for="excel-file" class="custom-file-btn">エクセルファイルを選択</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <h2>単元を選択してください</h2>
        <div id="category-list"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span id="current-category">単元名</span>
            <span id="q-progress">0 / 0 問</span>
        </div>
        <div id="q-text" class="q-text">問題文がここに表示されます。</div>
        <div id="options-list"></div>
        <div id="feedback"></div>
        <button id="next-btn" class="btn center-btn hidden" onclick="handleNext()">次の問題へ</button>
    </div>

    <div id="screen-result" class="screen">
        <h2>結果発表</h2>
        <div class="result-box">
            <div>あなたの正解数は</div>
            <div id="score-text" class="score-num">0 / 0</div>
            <div>でした！</div>
        </div>
        <button class="btn center-btn retry-btn" onclick="retryCurrentCategory()">もう一度この単元を解く（ランダム順）</button>
        <button class="btn center-btn" onclick="goToMenu()">単元選択に戻る</button>
    </div>
</div>

<script>
const state = {
    allQuestions: [],        // すべての問題
    categories: [],          // 単元名の一覧
    currentCategoryName: "", // 今選ばれている単元の名前
    currentQuestions: [],    // 今解いている単元の問題たち
    currentIndex: 0,         // 今何問目を解いているか
    score: 0                 // 正解した数
};

window.onload = function() {
    autoLoadExcel();
    document.getElementById('excel-file').addEventListener('change', handleFileSelect, false);
};

async function autoLoadExcel() {
    const statusMsg = document.getElementById("status-msg");
    try {
        const response = await fetch('MD.xlsx');
        if (!response.ok) {
            throw new Error("ファイルが見つかりません");
        }
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        
        processWorkbook(workbook);
        statusMsg.innerText = "自動読み込みが完了しました！";
        setTimeout(() => { showScreen("screen-menu"); }, 800);
        
    } catch (error) {
        console.log("自動読み込みスキップ:", error.message);
        statusMsg.innerText = "エクセルファイル（MD.xlsx）を選択してください。";
    }
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    document.getElementById("status-msg").innerText = "ファイルを読み込み中...";
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        processWorkbook(workbook);
        showScreen("screen-menu");
    };
    reader.readAsArrayBuffer(file);
}

function processWorkbook(workbook) {
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    
    // 【重要な修正】defval: "" を指定することで、空欄のセルがあっても左に詰められず、確実に空文字が入るようになります。
    const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
    
    state.allQuestions = [];
    const categorySet = new Set();

    if (rawData.length <= 1) {
        alert("エクセルファイルの中に有効な問題データが見つかりませんでした。");
        return;
    }

    // 1行目からデータ処理
    for (let i = 1; i < rawData.length; i++) {
        const row = rawData[i];
        if (!row || row.length === 0) continue;

        // 【列の位置を完全固定】
        const categoryVal = row[1] ? row[1].toString().trim() : "未分類"; // B列(1): 単元名
        const textVal     = row[2] ? row[2].toString().trim() : "";       // C列(2): 問題文
        
        // D〜G列(3〜6): 選択肢1〜4
        const opt1 = row[3] ? row[3].toString().trim() : "";
        const opt2 = row[4] ? row[4].toString().trim() : "";
        const opt3 = row[5] ? row[5].toString().trim() : "";
        const opt4 = row[6] ? row[6].toString().trim() : "";
        
        // H列(7): 正答番号（1〜4）
        let answerIndexRaw = row[7] ? row[7].toString().trim() : "";
        answerIndexRaw = answerIndexRaw.replace(/[１-４]/g, function(s) {
            return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
        });
        const answerIndex = parseInt(answerIndexRaw, 10);

        // 4つの選択肢を固定配列にする
        const originalOptions = [opt1, opt2, opt3, opt4];
        if (!textVal) continue;

        // 正答番号（1〜4）から「1」を引いて、正しい選択肢テキストを取得
        const correctAnswerText = (answerIndex >= 1 && answerIndex <= 4) 
            ? originalOptions[answerIndex - 1] 
            : "";

        // 万が一、正解テキストが空っぽの場合は、データ不備としてスキップ
        if (!correctAnswerText) continue;

        // I〜L列(8〜11): 解説1〜4
        let explanationParts = [];
        if (row[8]  && row[8].toString().trim() !== "")  explanationParts.push(row[8].toString().trim());
        if (row[9]  && row[9].toString().trim() !== "")  explanationParts.push(row[9].toString().trim());
        if (row[10] && row[10].toString().trim() !== "") explanationParts.push(row[10].toString().trim());
        if (row[11] && row[11].toString().trim() !== "") explanationParts.push(row[11].toString().trim());
        
        const explanationVal = explanationParts.length > 0 
            ? explanationParts.join("<br>") 
            : "解説はありません。";

        state.allQuestions.push({
            category: categoryVal,
            text: textVal,
            answer: correctAnswerText,
            options: originalOptions.filter(o => o !== ""), // 表示用のボタンからは空文字を除外
            explanation: explanationVal
        });
        categorySet.add(categoryVal);
    }
    
    state.categories = Array.from(categorySet);
    createMenu();
}

function createMenu() {
    const container = document.getElementById("category-list");
    container.innerHTML = "";
    
    state.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = cat;
        btn.onclick = () => startQuiz(cat, false);
        container.appendChild(btn);
    });
}

function startQuiz(categoryName, shouldShuffle = false) {
    state.currentCategoryName = categoryName;
    let questions = state.allQuestions.filter(q => q.category === categoryName);
    
    state.currentQuestions = questions.map(q => ({
        ...q,
        options: [...q.options]
    }));
    
    if (shouldShuffle) {
        shuffleArray(state.currentQuestions);
    }
    state.currentQuestions.forEach(q => shuffleArray(q.options));
    
    state.currentIndex = 0;
    state.score = 0;
    document.getElementById("current-category").innerText = categoryName;
    showQuiz();
    showScreen("screen-quiz");
}

function showQuiz() {
    const q = state.currentQuestions[state.currentIndex];
    document.getElementById("q-progress").innerText = (state.currentIndex + 1) + " / " + state.currentQuestions.length + " 問";
    document.getElementById("q-text").innerText = q.text;
    
    document.getElementById("feedback").style.display = "none";
    document.getElementById("next-btn").classList.add("hidden");
    
    const optionsContainer = document.getElementById("options-list");
    optionsContainer.innerHTML = "";
    
    q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(btn, opt, q);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(selectedBtn, selectedText, question) {
    const buttons = document.querySelectorAll("#options-list .option-btn");
    buttons.forEach(b => b.disabled = true);
    
    const isCorrect = (selectedText === question.answer);
    if (isCorrect) {
        selectedBtn.classList.add("correct");
        state.score++;
    } else {
        selectedBtn.classList.add("incorrect");
        buttons.forEach(b => {
            if (b.innerText === question.answer) {
                b.classList.add("correct");
            }
        });
    }
    
    const feedback = document.getElementById("feedback");
    feedback.style.display = "block";
    feedback.style.borderColor = isCorrect ? "var(--success)" : "var(--error)";
    feedback.innerHTML = "<strong>" + (isCorrect ? "⭕ 正解！" : "❌ 不正解...") + "</strong><br>" + question.explanation;
    
    document.getElementById("next-btn").classList.remove("hidden");
}

function handleNext() {
    state.currentIndex++;
    if (state.currentIndex < state.currentQuestions.length) {
        showQuiz();
    } else {
        document.getElementById("score-text").innerText = state.score + " / " + state.currentQuestions.length;
        showScreen("screen-result");
    }
}

// 同じ単元の問題をランダム（順不規則）にしてもう一度最初から解く処理
function retryCurrentCategory() {
    startQuiz(state.currentCategoryName, true);
}

function goToMenu() {
    showScreen("screen-menu");
}

function showScreen(screenId) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(screenId).classList.add("active");
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = array[i];
        array[i] = array[j];
        array[j] = temp;
    }
}
</script>

</body>
</html>
