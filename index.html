html<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香粧品化学問題集</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2; /* メインカラー（青） */
            --primary-hover: #357abd; /* ホバー時の濃い青 */
            --success: #2ecc71; /* 正解（緑） */
            --error: #e74c3c;   /* 不正解（赤） */
            --bg: #f4f7f6;
            --text: #333;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }
        #app {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            margin: 10px;
            box-sizing: border-box;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: left;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .center-btn {
            text-align: center;
        }
        /* ファイル入力エリアのデザイン */
        .file-input-container {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #fafafa;
            margin: 20px 0;
            position: relative;
        }
        .file-input-container p {
            margin: 0 0 15px 0;
            color: #666;
            font-size: 14px;
        }
        .custom-file-btn {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .custom-file-btn:hover {
            background-color: #d35400;
        }
        #excel-file {
            display: none;
        }
        /* 状態表示メッセージ */
        #status-msg {
            text-align: center;
            font-weight: bold;
            color: #e67e22;
            margin: 15px 0;
            min-height: 24px;
        }
        /* 問題表示用のスタイル */
        .q-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #7f8c8d;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .q-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }
        .option-btn:hover {
            background-color: #e9ecef;
        }
        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
        }
        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
        }
        /* 解説エリア */
        #feedback {
            margin: 20px 0;
            padding: 15px;
            border-left: 5px solid #ccc;
            border-radius: 4px;
            display: none;
            line-height: 1.6;
        }
        .hidden {
            display: none !important;
        }
        /* 結果画面 */
        .result-box {
            text-align: center;
            padding: 20px;
            background: #eef2f7;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .score-num {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
        /* 今回追加した特別デザインボタン */
        .retry-btn {
            background-color: #2ecc71;
        }
        .retry-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-load" class="screen active">
        <h1>香粧品化学問題集</h1>
        <div id="status-msg">問題ファイルを自動読み込み中...</div>
        
        <div class="file-input-container">
            <p>※自動読み込みが出ない場合は、下のボタンからエクセルファイル（MD.xlsx）を選んでください。</p>
            <label for="excel-file" class="custom-file-btn">エクセルファイルを選択</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <h2>単元を選択してください</h2>
        <div id="category-list"></div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span id="current-category">単元名</span>
            <span id="q-progress">0 / 0 問</span>
        </div>
        <div id="q-text" class="q-text">問題文がここに表示されます。</div>
        <div id="options-list"></div>
        <div id="feedback"></div>
        <button id="next-btn" class="btn center-btn hidden" onclick="handleNext()">次の問題へ</button>
    </div>

    <div id="screen-result" class="screen">
        <h2>結果発表</h2>
        <div class="result-box">
            <div>あなたの正解数は</div>
            <div id="score-text" class="score-num">0 / 0</div>
            <div>でした！</div>
        </div>
        <!-- ボタンを2つ配置しました -->
        <button class="btn center-btn retry-btn" onclick="retryCurrentCategory()">もう一度この単元を解く（ランダム順）</button>
        <button class="btn center-btn" onclick="goToMenu()">単元選択に戻る</button>
    </div>
</div>

<script>
const state = {
    allQuestions: [],     // 全問題
    categories: [],       // 単元リスト
    currentCategoryName: "", // 現在選択されている単元名（追加）
    currentQuestions: [], // 選択された単元の問題
    currentIndex: 0,      // 現在何問目か
    score: 0              // 正解数
};

// 画面起動時に自動読み込みを開始
window.onload = function() {
    autoLoadExcel();
    document.getElementById('excel-file').addEventListener('change', handleFileSelect, false);
};

// 自動読み込み処理
async function autoLoadExcel() {
    const statusMsg = document.getElementById("status-msg");
    try {
        const response = await fetch('MD.xlsx');
        if (!response.ok) {
            throw new Error("ファイルが見つかりません");
        }
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        
        processWorkbook(workbook);
        statusMsg.innerText = "自動読み込みが完了しました！";
        setTimeout(() => { showScreen("screen-menu"); }, 800);
        
    } catch (error) {
        console.log("自動読み込みスキップ:", error.message);
        statusMsg.innerText = "エクセルファイル（MD.xlsx）を選択してください。";
    }
}

// 手動ファイル選択処理
function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    document.getElementById("status-msg").innerText = "ファイルを読み込み中...";
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        processWorkbook(workbook);
        showScreen("screen-menu");
    };
    reader.readAsArrayBuffer(file);
}

// データ解析処理
function processWorkbook(workbook) {
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
    
    state.allQuestions = [];
    const categorySet = new Set();
    
    // 1行目は見出しなので2行目からループ
    for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length < 3) continue; // 空白行対策
        
        // Excelの列構成：A=単元, B=問題文, C=正解, D=選択肢2, E=選択肢3, F=選択肢4, G=解説
        const q = {
            category: row[0] ? row[0].toString().trim() : "未分類",
            text: row[1] ? row[1].toString() : "",
            answer: row[2] ? row[2].toString() : "",
            options: [],
            explanation: row[6] ? row[6].toString() : "解説はありません。"
        };
        
        // 選択肢（C列〜F列）を収集
        for (let j = 2; j <= 5; j++) {
            if (row[j] !== undefined && row[j] !== null && row[j] !== "") {
                q.options.push(row[j].toString());
            }
        }
        
        if (q.text) {
            state.allQuestions.push(q);
            categorySet.add(q.category);
        }
    }
    
    state.categories = Array.from(categorySet);
    createMenu();
}

// 単元選択メニューの作成
function createMenu() {
    const container = document.getElementById("category-list");
    container.innerHTML = "";
    
    state.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = cat;
        btn.onclick = () => startQuiz(cat, false); // 通常はシャッフルしない
        container.appendChild(btn);
    });
}

// クイズ開始処理（第2引数でシャッフルするかを指定）
function startQuiz(categoryName, shouldShuffle = false) {
    state.currentCategoryName = categoryName;
    // 該当する単元の問題を抽出
コードは注意してご使用ください。let questions = state.allQuestions.filter(q => q.category === categoryName);// ディープコピーして元データを壊さないようにするstate.currentQuestions = questions.map(q => ({...q,options: [...q.options] // 選択肢配列もコピー}));// 「もう一度」選択時のみシャッフルを実行if (shouldShuffle) {shuffleArray(state.currentQuestions);} else {// 通常時は、各問題内の「選択肢」だけをランダムに並び替えるstate.currentQuestions.forEach(q => shuffleArray(q.options));}state.currentIndex = 0;state.score = 0;document.getElementById("current-category").innerText = categoryName;showQuiz();showScreen("screen-quiz");}// 問題表示処理function showQuiz() {const q = state.currentQuestions[state.currentIndex];// 進捗表示document.getElementById("q-progress").innerText = ${state.currentIndex + 1} / ${state.currentQuestions.length} 問;// 問題文document.getElementById("q-text").innerText = q.text;// 解説非表示・次へボタン非表示document.getElementById("feedback").style.display = "none";document.getElementById("next-btn").classList.add("hidden");// 選択肢ボタン生成const optionsContainer = document.getElementById("options-list");optionsContainer.innerHTML = "";q.options.forEach(opt => {const btn = document.createElement("button");btn.className = "btn option-btn";btn.innerText = opt;btn.onclick = () => selectOption(btn, opt, q);optionsContainer.appendChild(btn);});}// 選択肢をクリックしたときの処理function selectOption(selectedBtn, selectedText, question) {const buttons = document.querySelectorAll("#options-list .option-btn");// 連打防止のためすべてのボタンを無効化buttons.forEach(b => b.disabled = true);const isCorrect = (selectedText === question.answer);if (isCorrect) {selectedBtn.classList.add("correct");state.score++;} else {selectedBtn.classList.add("incorrect");// 正解のボタンを探して緑色にするbuttons.forEach(b => {if (b.innerText === question.answer) {b.classList.add("correct");}});}// 解説の表示const feedback = document.getElementById("feedback");feedback.style.display = "block";feedback.style.borderColor = isCorrect ? "var(--success)" : "var(--error)";feedback.innerHTML = <strong>${isCorrect ? "⭕ 正解！" : "❌ 不正解..."}</strong><br>${question.explanation};// 次へボタンを表示document.getElementById("next-btn").classList.remove("hidden");}// 次の問題へボタンの処理function handleNext() {state.currentIndex++;if (state.currentIndex < state.currentQuestions.length) {showQuiz();} else {// 全問終了したら結果画面へdocument.getElementById("score-text").innerText = ${state.score} / ${state.currentQuestions.length};showScreen("screen-result");}}// 同じ単元をランダム順でもう一度解くfunction retryCurrentCategory() {startQuiz(state.currentCategoryName, true);}// 単元選択画面に戻るfunction goToMenu() {showScreen("screen-menu");}// 画面切り替えユーティリティfunction showScreen(screenId) {document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));document.getElementById(screenId).classList.add("active");}// 配列をランダムにシャッフルするアルゴリズム（フィッシャー・イェーツ）function shuffleArray(array) {for (let i = array.length - 1; i > 0; i--) {const j = Math.floor(Math.random() * (i + 1));[array[i], array[j]] = [array[j], array[i]];}}
### 🛠️ 動作の仕組み
* 学生が問題を全て解き終わると、自動的に「結果発表」画面に移ります。
* そこで緑色の **「もう一度この単元を解く（ランダム順）」** を押すと、内部で `shuffleArray()` というシャッフル用の計算が走り、問題の順番がガラッと入れ替わった状態で1問目から再スタートします。
* 青色の **「単元選択に戻る」** を押せば、いつでも最初のメニューに戻れます。

実際にファイルを上書きして、学生の皆さんに試してもらってみてください！また何か手を入れたい部分が見つかりましたら、いつでも**具体的な要望**を教えてくださいね。
